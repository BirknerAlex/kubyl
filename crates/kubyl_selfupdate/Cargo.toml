[package]
name = "kubyl_selfupdate"
description = "App self-update: signed manifest checks, background download, restart-to-apply."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
gpui.workspace = true
gpui-component.workspace = true
kubyl_core.workspace = true
kubyl_settings.workspace = true
kubyl_ui.workspace = true
minisign-verify.workspace = true
# Its reqwest (already in the tree through kubyl_kube): the manifest and artifact downloads.
openidconnect.workspace = true
schemars.workspace = true
self-replace.workspace = true
semver = { workspace = true, features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
zip.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
flate2.workspace = true
tar.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
