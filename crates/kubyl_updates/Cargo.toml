[package]
name = "kubyl_updates"
description = "Cluster update providers and preflight checks."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Cloud providers (decided in phase 13): off by default to keep the binary small.
updates-eks = ["dep:hmac", "dep:openidconnect"]
updates-gke = ["dep:openidconnect"]
updates-aks = ["dep:openidconnect"]

[dependencies]
futures.workspace = true
gpui.workspace = true
gpui-component.workspace = true
http.workspace = true
jiff.workspace = true
k8s-openapi.workspace = true
kube.workspace = true
kubyl_core.workspace = true
kubyl_explorer.workspace = true
kubyl_kube.workspace = true
kubyl_metrics.workspace = true
kubyl_operators.workspace = true
kubyl_resources.workspace = true
kubyl_settings.workspace = true
kubyl_ui.workspace = true
kubyl_yaml.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true

# Cloud providers.
hmac = { workspace = true, optional = true }
openidconnect = { workspace = true, optional = true }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
