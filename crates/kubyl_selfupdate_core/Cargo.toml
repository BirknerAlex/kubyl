[package]
name = "kubyl_selfupdate_core"
description = "Self-update without the UI: the signed update manifest, downloads, signature checks, installed-version detection and replacing the binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
kubyl_base.workspace = true
kubyl_settings_core.workspace = true
minisign-verify.workspace = true
openidconnect.workspace = true
schemars.workspace = true
self-replace.workspace = true
semver = { workspace = true, features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
zip.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
flate2.workspace = true
tar.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
