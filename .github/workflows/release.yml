name: Release

# Manual only: merges to main never cut a release. Trigger from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      dry_run:
        description: Compute the version and changelog, build nothing, publish nothing
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  RUST_TOOLCHAIN: "1.98"

permissions:
  contents: write

jobs:
  version:
    name: Compute version and changelog
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      proceed: ${{ steps.bump.outputs.proceed }}
    steps:
      # `main` is protected by a ruleset requiring PRs + passing status checks; the default
      # GITHUB_TOKEN (github-actions[bot]) isn't a bypass actor, so the direct push+tag below
      # would be rejected. RELEASE_PUSH_TOKEN is a token for the repo owner, who *is* a
      # configured bypass actor (see repo ruleset "Stable").
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PUSH_TOKEN }}

      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff,cargo-edit

      - name: Determine next version
        id: bump
        run: |
          set -euo pipefail
          CURRENT_TAG="$(git tag --sort=-v:refname -l 'v[0-9]*' | head -n1)"
          CURRENT_CARGO_VERSION="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')"

          if [ -z "$CURRENT_TAG" ]; then
            # First ever release: use whatever version is already in Cargo.toml.
            NEXT_VERSION="$CURRENT_CARGO_VERSION"
          elif [ "${{ inputs.bump }}" = "auto" ]; then
            NEXT_VERSION="$(git-cliff --bumped-version --tag-pattern 'v[0-9]*' | sed 's/^v//')"
            if [ "v$NEXT_VERSION" = "$CURRENT_TAG" ]; then
              echo "::error::No conventional commits since $CURRENT_TAG warrant a version bump. Use a manual bump input or add feat/fix commits."
              exit 1
            fi
          else
            cargo set-version --bump "${{ inputs.bump }}"
            NEXT_VERSION="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')"
            git checkout -- Cargo.toml Cargo.lock
          fi

          echo "version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEXT_VERSION" >> "$GITHUB_OUTPUT"

          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate changelog
        run: |
          set -euo pipefail
          git-cliff --tag "${{ steps.bump.outputs.tag }}" --unreleased --strip header \
            -o RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "_No conventional-commit changes recorded for this release._" > RELEASE_NOTES.md
          fi
          {
            echo "## v${{ steps.bump.outputs.version }}"
            echo
            cat RELEASE_NOTES.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write full CHANGELOG.md
        if: steps.bump.outputs.proceed == 'true'
        run: git-cliff --tag "${{ steps.bump.outputs.tag }}" -o CHANGELOG.md

      - name: Bump Cargo.toml and commit
        if: steps.bump.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          cargo set-version "${{ steps.bump.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock CHANGELOG.md
          git commit -m "chore(release): ${{ steps.bump.outputs.tag }}"
          git tag "${{ steps.bump.outputs.tag }}"
          # `git tag` (no -a) makes a lightweight tag, and `--follow-tags` only pushes
          # annotated ones — push the tag explicitly instead of relying on that.
          git push origin HEAD:main
          git push origin "${{ steps.bump.outputs.tag }}"

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: RELEASE_NOTES.md
          retention-days: 1

  build-macos:
    name: Build macOS (universal, notarized)
    needs: version
    if: needs.version.outputs.proceed == 'true'
    runs-on: macos-14
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-macos

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-bundle

      - name: Build both architectures
        run: |
          cargo build --release --locked -p kubyl --target aarch64-apple-darwin
          cargo build --release --locked -p kubyl --target x86_64-apple-darwin

      - name: Bundle .app and merge into a universal binary
        run: |
          set -euo pipefail
          cargo bundle --release -p kubyl --target aarch64-apple-darwin
          APP="target/aarch64-apple-darwin/release/bundle/osx/Kubyl.app"
          lipo -create -output "$APP/Contents/MacOS/kubyl" \
            target/aarch64-apple-darwin/release/kubyl \
            target/x86_64-apple-darwin/release/kubyl
          echo "APP=$APP" >> "$GITHUB_ENV"

      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PW="$(uuidgen)"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PW" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PW" build.keychain
          security import "$RUNNER_TEMP/cert.p12" -k build.keychain \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PW" build.keychain

      # The keychain entitlements in entitlements.plist are restricted: without a valid profile
      # that grants them and names the signing certificate, macOS kills Kubyl at launch. Check
      # before signing, not on users' Macs.
      - name: Embed provisioning profile
        env:
          MACOS_PROVISIONING_PROFILE: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          if [ -z "$MACOS_PROVISIONING_PROFILE" ]; then
            echo "::error::Secret MACOS_PROVISIONING_PROFILE is missing (docs/RELEASING.md, step 4)"
            exit 1
          fi
          PROFILE="$APP/Contents/embedded.provisionprofile"
          echo "$MACOS_PROVISIONING_PROFILE" | base64 --decode > "$PROFILE"
          security cms -D -i "$PROFILE" > "$RUNNER_TEMP/profile.plist"
          field() { /usr/libexec/PlistBuddy -c "Print :$1" "$2" 2>/dev/null || true; }
          APP_ID="$(field com.apple.application-identifier packaging/macos/entitlements.plist)"
          GROUP="$(field keychain-access-groups:0 packaging/macos/entitlements.plist)"
          PROFILE_APP_ID="$(field Entitlements:com.apple.application-identifier "$RUNNER_TEMP/profile.plist")"
          if [ "$PROFILE_APP_ID" != "$APP_ID" ]; then
            echo "::error::The profile is for '$PROFILE_APP_ID', entitlements.plist claims '$APP_ID'"
            exit 1
          fi
          if ! field Entitlements:keychain-access-groups "$RUNNER_TEMP/profile.plist" \
            | tr -d ' ' | grep -qxF -e "$GROUP" -e "${APP_ID%%.*}.*"; then
            echo "::error::The profile doesn't grant keychain access group '$GROUP'"
            exit 1
          fi
          EXPIRES="$(plutil -extract ExpirationDate raw "$RUNNER_TEMP/profile.plist")"
          EXPIRES_AT="$(date -j -u -f '%Y-%m-%dT%H:%M:%SZ' "$EXPIRES" +%s)"
          if [ "$EXPIRES_AT" -le "$(date -u +%s)" ]; then
            echo "::error::The profile expired on $EXPIRES"
            exit 1
          fi
          # Sign with the certificate the profile names (by SHA-1), not just any Developer ID.
          IDENTITY="$(security find-identity -v -p codesigning build.keychain \
            | awk '/Developer ID Application/ { print $2; exit }')"
          COUNT="$(plutil -extract DeveloperCertificates raw "$RUNNER_TEMP/profile.plist")"
          PROFILE_CERTS="$(for ((i = 0; i < COUNT; i++)); do
            plutil -extract "DeveloperCertificates.$i" raw "$RUNNER_TEMP/profile.plist" \
              | base64 --decode | shasum -a 1 | awk '{ print toupper($1) }'
          done)"
          if [ -z "$IDENTITY" ] || ! grep -qxF "$IDENTITY" <<< "$PROFILE_CERTS"; then
            echo "::error::The profile doesn't name the certificate in MACOS_CERTIFICATE_P12"
            exit 1
          fi
          echo "SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "Profile '$(field Name "$RUNNER_TEMP/profile.plist")', expires $EXPIRES"

      - name: Codesign
        run: |
          set -euo pipefail
          codesign --deep --force --options runtime --timestamp \
            --entitlements packaging/macos/entitlements.plist \
            --sign "$SIGNING_IDENTITY" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -d --entitlements - --xml "$APP" | grep -q keychain-access-groups

      - name: Create DMG
        run: |
          set -euo pipefail
          DMG_ROOT="$RUNNER_TEMP/dmg-root"
          mkdir -p "$DMG_ROOT"
          cp -R "$APP" "$DMG_ROOT/"
          ln -s /Applications "$DMG_ROOT/Applications"
          DMG="kubyl-$VERSION-macos-universal.dmg"
          hdiutil create -volname Kubyl -srcfolder "$DMG_ROOT" -ov -format UDZO "$DMG"
          codesign --sign "Developer ID Application" --timestamp "$DMG"
          echo "DMG=$DMG" >> "$GITHUB_ENV"

      - name: Notarize
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          echo "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/apple_api_key.p8"
          xcrun notarytool submit "$DMG" \
            --key "$RUNNER_TEMP/apple_api_key.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$DMG"

      - uses: actions/upload-artifact@v4
        with:
          name: kubyl-macos-universal
          path: kubyl-*.dmg
          retention-days: 7

  build-windows:
    name: Build Windows (${{ matrix.arch }})
    needs: version
    if: needs.version.outputs.proceed == 'true'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x86_64
          - target: aarch64-pc-windows-msvc
            arch: aarch64
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-windows-${{ matrix.arch }}

      - name: Build
        run: cargo build --release --locked -p kubyl --target ${{ matrix.target }}

      - name: Zip
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/kubyl.exe,LICENSE-MIT,LICENSE-APACHE `
            -DestinationPath kubyl-$env:VERSION-windows-${{ matrix.arch }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: kubyl-windows-${{ matrix.arch }}
          path: kubyl-*.zip
          retention-days: 7

  build-linux:
    name: Build and package Linux (${{ matrix.arch }})
    needs: version
    if: needs.version.outputs.proceed == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            arch: amd64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            arch: arm64
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Install Linux dependencies (Wayland, X11, xkb, fontconfig, Vulkan, WebKitGTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config clang \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxi-dev libxrandr-dev \
            libfontconfig1-dev libfreetype-dev \
            libvulkan-dev libasound2-dev libzstd-dev libssl-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-linux-${{ matrix.arch }}

      - name: Build
        run: cargo build --release --locked -p kubyl --target ${{ matrix.target }}

      - name: Raw binary tarball
        run: |
          set -euo pipefail
          STAGE="$(mktemp -d)/kubyl-$VERSION-linux-${{ matrix.arch }}"
          mkdir -p "$STAGE"
          cp target/${{ matrix.target }}/release/kubyl "$STAGE/"
          cp LICENSE-MIT LICENSE-APACHE "$STAGE/"
          tar -C "$(dirname "$STAGE")" -czf "kubyl-$VERSION-linux-${{ matrix.arch }}.tar.gz" \
            "$(basename "$STAGE")"

      - name: Install nfpm
        run: |
          set -euo pipefail
          NFPM_ARCH="$([ '${{ matrix.arch }}' = amd64 ] && echo x86_64 || echo arm64)"
          curl -sSL "https://github.com/goreleaser/nfpm/releases/download/v2.47.0/nfpm_2.47.0_Linux_${NFPM_ARCH}.tar.gz" \
            | sudo tar -xz -C /usr/local/bin nfpm

      - name: Build .deb and .rpm
        env:
          VERSION: ${{ env.VERSION }}
          ARCH: ${{ matrix.arch }}
          BIN_PATH: target/${{ matrix.target }}/release/kubyl
        run: |
          set -euo pipefail
          for pkg in deb rpm; do
            nfpm package --config nfpm.yaml --packager "$pkg" --target .
          done

      # Arch Linux is x86_64-only upstream (ARM users are on the separate Arch Linux ARM
      # distro), so this package only makes sense for the amd64 leg of the matrix.
      - name: Build Arch package
        if: matrix.arch == 'amd64'
        env:
          VERSION: ${{ env.VERSION }}
          ARCH: ${{ matrix.arch }}
          BIN_PATH: target/${{ matrix.target }}/release/kubyl
        run: nfpm package --config nfpm.yaml --packager archlinux --target .

      - name: Build AppImage
        run: |
          ./script/build-appimage.sh "$VERSION" \
            "$([ '${{ matrix.arch }}' = amd64 ] && echo x86_64 || echo aarch64)" \
            "target/${{ matrix.target }}/release/kubyl"

      - uses: actions/upload-artifact@v4
        with:
          name: kubyl-linux-${{ matrix.arch }}
          path: |
            kubyl-*.tar.gz
            *.deb
            *.rpm
            *.pkg.tar.zst
            *.AppImage
          retention-days: 7

  build-update-manifest:
    name: Build and sign self-update manifest
    needs: [version, build-macos, build-windows, build-linux]
    if: needs.version.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS

      - uses: taiki-e/install-action@v2
        with:
          tool: minisign

      # Signs with kubyl_selfupdate's release key (verified against the public half hardcoded
      # in crates/kubyl_selfupdate/src/verify.rs). Setup: docs/RELEASING.md.
      - name: Sign manifest
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::error::Secret UPDATE_SIGNING_KEY is missing (docs/RELEASING.md)"
            exit 1
          fi
          echo "$UPDATE_SIGNING_KEY" > "$RUNNER_TEMP/minisign.key"
          DIST=dist MINISIGN_KEY_FILE="$RUNNER_TEMP/minisign.key" \
            ./script/sign-update-manifest.sh "$VERSION" stable

      - uses: actions/upload-artifact@v4
        with:
          name: kubyl-update-manifest
          path: |
            updates-*.json
            updates-*.json.minisig
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [version, build-macos, build-windows, build-linux, build-update-manifest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          mv RELEASE_NOTES.md ..
          sha256sum -- * > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.version.outputs.tag }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "Kubyl ${{ needs.version.outputs.tag }}" \
            --notes-file RELEASE_NOTES.md

  publish-winget:
    name: Submit winget manifest update
    needs: [version, release]
    if: needs.version.outputs.proceed == 'true'
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Install wingetcreate
        run: Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe

      # First submission (`BirknerAlex.Kubyl` doesn't exist in microsoft/winget-pkgs yet) is a
      # one-time manual `wingetcreate new` — see docs/RELEASING.md. This only updates an
      # already-submitted manifest, so it fails until that's done once.
      - name: Update and submit manifest
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if (-not $env:WINGET_TOKEN) {
            Write-Error "Secret WINGET_TOKEN is missing (docs/RELEASING.md)"
            exit 1
          }
          $x64 = "https://github.com/BirknerAlex/kubyl/releases/download/v$env:VERSION/kubyl-$env:VERSION-windows-x86_64.zip"
          $arm64 = "https://github.com/BirknerAlex/kubyl/releases/download/v$env:VERSION/kubyl-$env:VERSION-windows-aarch64.zip"
          .\wingetcreate.exe update BirknerAlex.Kubyl --version $env:VERSION `
            --urls $x64 $arm64 --submit --token $env:WINGET_TOKEN

  publish-silo:
    name: Publish Linux packages to silo
    needs: [version, build-linux]
    if: needs.version.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: kubyl-linux-*
          path: dist
          merge-multiple: true

      - uses: BirknerAlex/silo/.github/actions/publish@v0.14.0
        with:
          server: https://silo.tyrola.dev
          token: ${{ secrets.SILO_KUBYL_TOKEN }}
          repo: kubyl
          channel: stable
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
