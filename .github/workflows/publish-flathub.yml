name: Publish to Flathub

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish-flathub:
    runs-on: ubuntu-latest
    steps:
      # `release: published` checks out the release tag (detached HEAD) by default. main is
      # protected by a ruleset requiring PRs + passing status checks (see release.yml), so this
      # needs the same RELEASE_PUSH_TOKEN bypass-actor token the version job uses, not the
      # default GITHUB_TOKEN.
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.RELEASE_PUSH_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Update Flatpak manifest with release sha256
        run: ./script/update-flatpak-manifest.sh "${{ steps.version.outputs.version }}"

      - name: Commit updated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add io.github.birkneralex.Kubyl.yml
          git commit -m "chore: update Flatpak manifest to v${{ steps.version.outputs.version }}" || true
          git push origin main

      - name: Submit to Flathub (manual)
        # After first submission is approved, update the message below with the app's own
        # flathub/<app-id> repo URL — that's what Flathub's build bot actually watches, not
        # this repo (see docs/FLATHUB.md).
        run: |
          echo "Flatpak manifest updated for v${{ steps.version.outputs.version }}"
          echo "Flathub submission guide:"
          echo "1. First time: fork flathub/flathub from its new-pr branch and submit manifest via PR (see docs/FLATHUB.md)"
          echo "2. After approval: push updated manifests to the flathub/io.github.birkneralex.Kubyl repo Flathub creates — this job only keeps this repo's copy current, it doesn't publish to Flathub by itself"
