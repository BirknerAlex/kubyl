
# git-cliff configuration: https://git-cliff.org/docs/configuration
# Drives both changelog generation and semantic version bumping for
# `.github/workflows/release.yml`. Conventional Commits are required for
# accurate `--bumped-version` output (feat -> minor, fix -> patch, "!"/BREAKING
# CHANGE -> major).

[changelog]
header = """
# Changelog\n
All notable changes to Kubyl are documented here.\n
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/BirknerAlex/kubyl/commit/{{ commit.id }}))\
    {% endfor %}
{% endfor %}\n
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9]*"
sort_commits = "oldest"
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactor" },
    { message = "^doc", group = "Documentation" },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore", group = "Miscellaneous" },
    { message = "^test", group = "Testing" },
    { message = "^ci", group = "CI" },
    { body = ".*security", group = "Security" },
]
