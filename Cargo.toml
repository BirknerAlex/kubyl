[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/kubyl"]

[workspace.package]
version = "0.3.7"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/BirknerAlex/kubyl"
authors = ["Alexander Birkner <alexander.birkner@g-portal.com>"]
publish = false

[workspace.dependencies]
# Internal crates
kubyl_alerts = { path = "crates/kubyl_alerts" }
kubyl_charts = { path = "crates/kubyl_charts" }
kubyl_argocd = { path = "crates/kubyl_argocd" }
kubyl_core = { path = "crates/kubyl_core" }
kubyl_explorer = { path = "crates/kubyl_explorer" }
kubyl_files = { path = "crates/kubyl_files" }
kubyl_keymap = { path = "crates/kubyl_keymap" }
kubyl_kube = { path = "crates/kubyl_kube" }
kubyl_kubeconfig = { path = "crates/kubyl_kubeconfig" }
kubyl_logs = { path = "crates/kubyl_logs" }
kubyl_metrics = { path = "crates/kubyl_metrics" }
kubyl_netflow = { path = "crates/kubyl_netflow" }
kubyl_operators = { path = "crates/kubyl_operators" }
kubyl_overview = { path = "crates/kubyl_overview" }
kubyl_palette = { path = "crates/kubyl_palette" }
kubyl_portforward = { path = "crates/kubyl_portforward" }
kubyl_prometheus = { path = "crates/kubyl_prometheus" }
kubyl_resources = { path = "crates/kubyl_resources" }
kubyl_selfupdate = { path = "crates/kubyl_selfupdate" }
kubyl_settings = { path = "crates/kubyl_settings" }
kubyl_terminal = { path = "crates/kubyl_terminal" }
kubyl_ui = { path = "crates/kubyl_ui" }
kubyl_updates = { path = "crates/kubyl_updates" }
kubyl_webview = { path = "crates/kubyl_webview" }
kubyl_yaml = { path = "crates/kubyl_yaml" }

# GPUI. `gpui-pre-*` are crates.io snapshots of zed-industries/zed (0.3.6 = zed@bcf6582),
# the exact snapshot gpui-component 0.6.6 is built against. Bump all of these together, in their own PR.
gpui = { package = "gpui-pre", version = "=0.3.6" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.6", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
gpui-base = "=0.6.6"
gpui-component = "=0.6.6"

# Kubernetes
kube = { version = "4.2.0", default-features = false, features = ["client", "config", "runtime", "ws", "oauth", "oidc", "gzip", "rustls-tls", "ring", "http-proxy", "socks5"] }
k8s-openapi = { version = "0.28.0", features = ["latest"] }
http = "1.5.0"
http-body-util = "0.1.5"
jiff = "0.2.37"
tower = { version = "0.5.3", features = ["buffer", "filter"] }
# kube's HTTP stack, rebuilt in `kubyl_kube::transport` to speak HTTP/2 (same versions as kube).
hyper = { version = "1.11.1", default-features = false }
hyper-util = { version = "0.1.20", default-features = false, features = ["client-legacy", "client-proxy", "http1", "http2", "tokio"] }
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http1", "http2"] }
hyper-timeout = "0.5.2"
tower-http = { version = "0.6.11", default-features = false, features = ["decompression-gzip"] }

# Auth: OS keychain and OIDC (openidconnect brings its own reqwest, re-exported as `openidconnect::reqwest`).
keyring = "4.2.0"
# macOS data protection keychain (keyring's v1 API only has the login keychain).
apple-native-keyring-store = { version = "1.0.2", features = ["protected"] }
openidconnect = { version = "4.0.1", default-features = false, features = ["reqwest", "rustls-tls"] }
secrecy = "0.10.3"
# The OS trust store for HTTP clients outside kube (OpenShift's OAuth server).
rustls-native-certs = "0.8.4"
# TLS checks of the kubeconfig editor (the versions and features kube already uses).
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = "1.15.1"
tokio-rustls = { version = "0.26.5", default-features = false, features = ["ring", "tls12", "logging"] }

# Assets
gpui-kit-assets = "=0.6.6"

# macOS integration (already in the tree through GPUI)
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData"] }

# Unix process limits (already in the tree)
libc = "0.2.189"

# Web views (phase 08): WKWebView on macOS, WebView2 on Windows, WebKitGTK on Linux.
wry = { version = "0.57.0", default-features = false, features = ["devtools"] }
raw-window-handle = "0.6.2"
webview2-com = "0.39.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse"] }
x509-cert = { version = "0.3.0", default-features = false, features = ["std"] }
# The GTK/WebKitGTK bindings wry uses (webkit2gtk pinned like wry pins it).
gtk = "0.18.2"
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }

# Terminal backend (Apache-2.0, same approach as Zed without Zed's GPL view code).
alacritty_terminal = "0.26.0"

# gRPC client for Hubble Relay (phase 16): client only (no server, no axum), TLS on ring like
# kube. Code is generated from vendored .proto files in build.rs by protox (pure Rust, no protoc).
tonic = { version = "0.14.6", default-features = false, features = ["channel", "codegen", "tls-ring"] }
tonic-prost = "0.14.6"
tonic-prost-build = { version = "0.14.6", default-features = false }
prost = "0.14.4"
prost-types = "0.14.4"
protox = "0.9.1"
# Force-directed layout of the network topology (phase 16): d3-force ported to Rust, no dependencies.
fjadra = "0.2.1"

# General
anyhow = "1.0.104"
base64 = "0.22.1"
dirs = "7.0.0"
# gzip of Helm releases and OLM bundle ConfigMaps (phase 12; already in the tree through GPUI).
flate2 = "1.1.10"
futures = "0.3.34"
granit-parser = "1.3.0"
# SigV4 signing of the EKS update provider (phase 13; already in the tree, pairs with sha2 0.11).
hmac = "0.13.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
lsp-types = "0.97.0" # the version gpui-component uses for editor hover/completion types
# Verifies the ed25519-signed self-update manifest (phase 09); CI signs it with the `minisign`
# CLI (script/sign-update-manifest.sh), this only ever verifies.
minisign-verify = "0.3.0"
notify = "8.2.0"
nucleo-matcher = "0.3.1"
open = "5.4.4"
parking_lot = "0.12.5"
regex = "1.13.1"
rust-embed = { version = "8.12.0", features = ["include-exclude"] }
schemars = "1.2.2"
# In-place executable replacement for self-update (phase 09): handles the platform quirks
# (Windows can't overwrite a running .exe; rename-then-replace instead).
self-replace = "1.5.0"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde-saphyr = "1.3.0"
sha2 = "0.11.0"
similar = "3.2.0"
smallvec = "1.15.2" # kube 4.2 (serde-saphyr 0.0.29) needs < 1.16
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "net", "io-util", "fs"] }
tracing = "0.1.44"
url = "2.5.8"
winresource = "0.1.31"
# Reads the downloaded Windows .zip update artifact (phase 09); deflate only, no encryption.
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.dev]
debug = "limited"
split-debuginfo = "unpacked"

# GPUI and its layout/text stack are slow unoptimized; keep them fast in dev builds.
[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
taffy = { opt-level = 3 }
resvg = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
# The topology layout runs every second while a graph is live.
fjadra = { opt-level = 3 }

[profile.release]
lto = "thin"
codegen-units = 1
