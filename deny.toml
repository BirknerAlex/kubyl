# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
#
# Kubyl is MIT OR Apache-2.0. Only permissive licenses (plus file-level MPL-2.0) are allowed,
# so GPL/LGPL/AGPL crates are rejected. This is what keeps Zed's GPL-3.0 crates
# (`editor`, `workspace`, `terminal_view`, …) out of the dependency tree.

[graph]
all-features = false
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "bzip2-1.0.6",
    # Weak, file-level copyleft; fine to link from an MIT/Apache app.
    "MPL-2.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # Zed's GPL-3.0 crates, by name, in case one is ever published under a permissive
    # license field by mistake.
    { name = "editor" },
    { name = "workspace" },
    { name = "terminal_view" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[advisories]
# Unmaintained crates deep in GPUI's tree are reported but not fatal; vulnerabilities are.
unmaintained = "workspace"
ignore = [
    # Marvin attack on `rsa` private-key operations (no fixed release exists). `rsa` comes in
    # through openidconnect, which only verifies ID token signatures with the IdP's public keys;
    # Kubyl never decrypts or signs with an RSA private key.
    { id = "RUSTSEC-2023-0071", reason = "rsa is only used for public-key signature verification (openidconnect)" },
]
