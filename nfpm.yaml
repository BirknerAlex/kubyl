name: kubyl
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: utils
priority: optional
maintainer: "Alexander Birkner <alexander.birkner@g-portal.com>"
description: Native Kubernetes desktop client
vendor: "Alexander Birkner"
homepage: https://github.com/BirknerAlex/kubyl
license: MIT

contents:
  - src: ${BIN_PATH}
    dst: /usr/bin/kubyl
    expand: true
    file_info:
      mode: 0755
  - src: packaging/linux/kubyl.desktop
    dst: /usr/share/applications/kubyl.desktop
    file_info:
      mode: 0644
  - src: assets/logo/png/app-icon-16.png
    dst: /usr/share/icons/hicolor/16x16/apps/kubyl.png
    file_info: { mode: 0644 }
  - src: assets/logo/png/app-icon-32.png
    dst: /usr/share/icons/hicolor/32x32/apps/kubyl.png
    file_info: { mode: 0644 }
  - src: assets/logo/png/app-icon-48.png
    dst: /usr/share/icons/hicolor/48x48/apps/kubyl.png
    file_info: { mode: 0644 }
  - src: assets/logo/png/app-icon-64.png
    dst: /usr/share/icons/hicolor/64x64/apps/kubyl.png
    file_info: { mode: 0644 }
  - src: assets/logo/png/app-icon-128.png
    dst: /usr/share/icons/hicolor/128x128/apps/kubyl.png
    file_info: { mode: 0644 }
  - src: assets/logo/png/app-icon-256.png
    dst: /usr/share/icons/hicolor/256x256/apps/kubyl.png
    file_info: { mode: 0644 }
  - src: assets/logo/png/app-icon-512.png
    dst: /usr/share/icons/hicolor/512x512/apps/kubyl.png
    file_info: { mode: 0644 }
  - src: assets/logo/png/app-icon-1024.png
    dst: /usr/share/icons/hicolor/1024x1024/apps/kubyl.png
    file_info: { mode: 0644 }
  - src: LICENSE-MIT
    dst: /usr/share/doc/kubyl/LICENSE-MIT
    file_info: { mode: 0644 }
  - src: LICENSE-APACHE
    dst: /usr/share/doc/kubyl/LICENSE-APACHE
    file_info: { mode: 0644 }

# Shared-library runtime deps for the Wayland/X11/Vulkan/fontconfig stack GPUI links
# against (mirrors the -dev packages .github/workflows/ci.yml installs to build it).
overrides:
  deb:
    depends:
      - libwayland-client0
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libx11-6
      - libxcb1
      - libxi6
      - libxrandr2
      - libfontconfig1
      - libfreetype6
      - libvulkan1
      - libasound2t64 | libasound2
      - libzstd1
  rpm:
    depends:
      - libwayland-client
      - libxkbcommon
      - libxkbcommon-x11
      - libX11
      - libxcb
      - libXi
      - libXrandr
      - fontconfig
      - freetype
      - vulkan-loader
      - alsa-lib
      - libzstd
  archlinux:
    depends:
      - wayland
      - libxkbcommon
      - libx11
      - libxcb
      - libxi
      - libxrandr
      - fontconfig
      - freetype2
      - vulkan-icd-loader
      - alsa-lib
      - zstd

archlinux:
  pkgbase: kubyl
